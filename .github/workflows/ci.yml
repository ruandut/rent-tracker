name: CI

# Two jobs, run side by side: `lint` (ruff, the frontend's lint, formatting and types, and the
# Dockerfile's lint) and `test` (pytest against Postgres 18). Their names are the checks main's
# ruleset requires, so rename them only together with it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install ruff (the lock file's version)
        working-directory: backend
        run: uv sync --locked --only-group lint

      - name: ruff check
        working-directory: backend
        run: uv run --no-sync ruff check --output-format=github .

      - name: ruff format
        # Run even if a step above failed, so one push shows every problem.
        if: ${{ !cancelled() }}
        working-directory: backend
        run: uv run --no-sync ruff format --check --diff .

      - uses: pnpm/action-setup@v4
        if: ${{ !cancelled() }}
        with:
          version: 12.15.0 # frontend/package.json's devEngines, and the Dockerfile's

      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install the frontend's dependencies
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend lint, formatting and types (vp check)
        if: ${{ !cancelled() }}
        working-directory: frontend
        # The route tree is generated by the build; checking needs it current.
        run: pnpm exec vp build && pnpm exec vp check

      - name: Dockerfile lint (no build; publish-image.yml builds)
        if: ${{ !cancelled() }}
        run: docker buildx build --check .

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rent
          POSTGRES_PASSWORD: rent
          POSTGRES_DB: rent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway values for the service container above and the test settings, nothing else.
      DATABASE_URL: postgres://rent:rent@localhost:5432/rent
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      MFA_ENCRYPTION_KEY: Y2ktb25seS1ub3QtYS1zZWNyZXQtY2ktb25seS1jaSE=
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: pytest
        run: uv run --no-sync pytest -rs
