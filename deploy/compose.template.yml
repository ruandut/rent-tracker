# Template for scripts/generate_compose.sh, which fills in the placeholders. Copy the generated
# file into your Docker app rather than this one. Only `web` publishes a port;
# Postgres and Hatchet stay on the internal network.
name: rent-tracker

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-app-env: &app-env
  DEBUG: "false"
  DJANGO_SECRET_KEY: "__DJANGO_SECRET_KEY__"
  DATABASE_URL: postgres://rent:__POSTGRES_PASSWORD__@postgres:5432/rent
  # The LAN address over http and, when there is one, the public hostname over https.
  # Set by scripts/generate_compose.sh: rerun it rather than editing these.
  ALLOWED_HOSTS: __ALLOWED_HOSTS__
  CSRF_TRUSTED_ORIGINS: __CSRF_TRUSTED_ORIGINS__
  # Signs the login captcha's challenges.
  ALTCHA_HMAC_KEY: "__ALTCHA_HMAC_KEY__"
  # With a public hostname: the proxies in front (1 for Cloudflare), so rate limits see each
  # visitor's own IP, and HTTPS on for secure cookies and HSTS. Both 0/false for LAN only.
  NUM_PROXIES: "__NUM_PROXIES__"
  HTTPS: "__HTTPS__"
  # Database backups (Django admin, Database backups). The worker writes dumps here and web
  # deletes them; both mount the backups volume. Copy it off the server too, or set
  # AWS_S3_BACKUP_BUCKET and credentials to send schedules to S3 or an S3-compatible service.
  BACKUP_ROOT: /backups

x-app: &app
  # Published from main by .github/workflows/publish-image.yml.
  image: ghcr.io/__IMAGE__:latest
  restart: unless-stopped
  logging: *default-logging

x-hatchet-db: &hatchet-db postgresql://rent:__POSTGRES_PASSWORD__@postgres:5432/hatchet?sslmode=disable

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: rent
      POSTGRES_PASSWORD: "__POSTGRES_PASSWORD__"
      POSTGRES_DB: rent
    # Hatchet keeps its state in its own database on this server. This creates it once Postgres
    # is accepting connections, and is a no-op after that.
    entrypoint:
      - sh
      - -c
      - >-
        (export PGPASSWORD="$$POSTGRES_PASSWORD";
        until pg_isready -q -h 127.0.0.1 -U rent -d rent; do sleep 1; done;
        psql -h 127.0.0.1 -U rent -d rent -tc "SELECT 1 FROM pg_database WHERE datname = 'hatchet'" | grep -q 1 ||
        psql -h 127.0.0.1 -U rent -d rent -c "CREATE DATABASE hatchet") &
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # Healthy means others can connect and Hatchet's database exists. Over TCP on purpose:
      # during first-time setup Postgres answers on its socket only.
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U rent -d hatchet -c 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20

  hatchet:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:v0.110.5
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: *hatchet-db
      # hatchet-lite's built-in default tenant.
      TENANT_ID: 707d0855-80ab-4e1f-a156-f1c4546cbf52
      RABBITMQ_ENABLED: "false"
      SERVER_MSGQUEUE_KIND: postgres
      SERVER_AUTH_COOKIE_DOMAIN: localhost
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_AUTH_SET_EMAIL_VERIFIED: "t"
      SERVER_GRPC_BIND_ADDRESS: "0.0.0.0"
      SERVER_GRPC_INSECURE: "t"
      SERVER_GRPC_PORT: "7077"
      SERVER_GRPC_BROADCAST_ADDRESS: hatchet:7077
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: localhost:7077
      SERVER_URL: http://localhost:8888
      SERVER_DEFAULT_ENGINE_VERSION: V1
    # Mints the worker's API token once, in the background, after Hatchet writes its config. The
    # token lives in a volume the worker reads, and healthy means it exists.
    entrypoint:
      - sh
      - -c
      - >-
        (test -s /token/client-token && exit 0;
        until test -s /config/server.yaml; do sleep 2; done;
        until out=$$(/hatchet-admin token create --config /config --tenant-id $$TENANT_ID); do sleep 3; done;
        echo "$$out" | tail -1 > /token/client-token) &
        exec ./entrypoint.sh
    volumes:
      - hatchet_config:/config
      - hatchet_token:/token
    healthcheck:
      test: ["CMD-SHELL", "test -s /token/client-token"]
      interval: 5s
      timeout: 3s
      retries: 36

  web:
    <<: *app
    environment:
      <<: *app-env
      # Only used to create the first login; changing them later does nothing.
      ADMIN_USERNAME: "__ADMIN_USERNAME__"
      ADMIN_PASSWORD: "__ADMIN_PASSWORD__"
    # Migrates and creates the first admin on every start; both are no-ops when nothing changed.
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py bootstrap_admin &&
        exec gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 2 --access-logfile -
    ports:
      - "__PORT__:8000"
    # On the tunnel's network too, so it can reach http://rent-tracker-web-1:8000. Lines marked
    # tunnel-only are dropped by scripts/generate_compose.sh when there's no tunnel network.
    networks:  # tunnel-only
      - default  # tunnel-only
      - tunnel  # tunnel-only
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *app
    environment:
      <<: *app-env
      HATCHET_CLIENT_TLS_STRATEGY: none
      HATCHET_CLIENT_HOST_PORT: hatchet:7077
    command:
      - sh
      - -c
      - HATCHET_CLIENT_TOKEN=$$(cat /token/client-token) exec python manage.py hatchet_worker
    volumes:
      - hatchet_token:/token:ro
      - backups:/backups
    depends_on:
      web:
        condition: service_healthy
      hatchet:
        condition: service_healthy

# Named outright so they stay the same whatever the Docker app calls the project. The database
# keeps the password it was created with, so these must keep matching this file's secrets.
volumes:
  postgres_data:
    name: rent-tracker-postgres
  hatchet_config:
    name: rent-tracker-hatchet-config
  hatchet_token:
    name: rent-tracker-hatchet-token
  backups:
    name: rent-tracker-backups

# A tunnel such as cloudflared, made outside this project, and the Docker network it is on.
networks:  # tunnel-only
  tunnel:  # tunnel-only
    name: __TUNNEL_NETWORK__  # tunnel-only
    external: true  # tunnel-only
