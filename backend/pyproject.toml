[project]
name = "rent-tracker-backend"
version = "0.1.0"
description = "Rental money tracker: Django + DRF + JWT + Hatchet + Postgres"
authors = [{ name = "Ruan" }]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<6.2",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "gunicorn>=26.2.0",
    "hatchet-sdk>=1.43.0",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
